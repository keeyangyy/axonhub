version: 2

project_name: axonhub

dist: .builds

before:
  hooks:
    - /bin/sh -c 'cd deploy && chmod +x *.sh'
    - make build-frontend
    - make generate-schema
    - go mod tidy
    - ./scripts/verify-go-sse-dependency-test.sh
    - ./scripts/verify-go-sse-dependency.sh

builds:
  - id: build
    main: ./cmd/axonhub
    binary: axonhub
    flags:
      - -tags=nomsgpack
    ldflags:
      - -s -w -X github.com/looplj/axonhub/internal/build.Version={{ .Tag }}
      - -s -w -X github.com/looplj/axonhub/internal/build.Commit={{ .Commit }}
      - -s -w -X github.com/looplj/axonhub/internal/build.BuildTime={{ .Date }}
    env:
      - CGO_ENABLED=0
    hooks:
      post:
        - ./scripts/verify-go-sse-dependency.sh "{{ .Path }}"
    goos:
      - windows          # fork 自用：只出 Windows 成品（官方原 9 平台；需要时把 linux/darwin/freebsd 加回）
    goarch:
      - amd64            # 需要 ARM 设备支持时加回 arm64

release:
  draft: false   # fork 自用：打 tag 直接正式发布（官方原为 true，需人工 publish）
  extra_files:
    - glob: ./config.schema.json

archives:
  - id: archive
    ids: [build]
    formats: [zip]
    files:
      - LICENSE
      - CHANGELOG.md
      - src: deploy/install.sh
        dst: install.sh
      - src: deploy/start.sh
        dst: start.sh
      - src: deploy/stop.sh
        dst: stop.sh
      - src: deploy/restart.sh
        dst: restart.sh
      - src: deploy/upgrade.sh
        dst: upgrade.sh
        
      - src: deploy/install.ps1
        dst: install.ps1
      - src: deploy/start.ps1
        dst: start.ps1
      - src: deploy/stop.ps1
        dst: stop.ps1
      - src: deploy/restart.ps1
        dst: restart.ps1
      - src: deploy/upgrade.ps1
        dst: upgrade.ps1

      - src: deploy/install.bat
        dst: install.bat
      - src: deploy/start.bat
        dst: start.bat
      - src: deploy/stop.bat
        dst: stop.bat
      - src: deploy/restart.bat
        dst: restart.bat
      - src: deploy/upgrade.bat
        dst: upgrade.bat

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: '{{ incpatch .Version }}-snapshot'

changelog:
  sort: asc
  filters:
    exclude:
      - '^examples:'
      - '^ui:'